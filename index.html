<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#003366"><link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><title>Saado POS</title>
<style>
:root{--n:#003366;--g:#FFBF00;--l:#F5F5F5;--t:#14233a;--m:#5c6b7d;--bad:#b3261e}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:16px system-ui,sans-serif;background:var(--l);color:var(--t);min-height:100dvh}
button,input,select{font:inherit}
button{border:0;border-radius:12px;padding:10px 14px;background:var(--n);color:#fff;font-weight:700;min-height:48px}
button.g{background:var(--g);color:var(--n)}button.o{background:#fff;color:var(--n);border:2px solid var(--n)}
input,select{width:100%;padding:10px 12px;border:2px solid #cfd6df;border-radius:12px;background:#fff;min-height:48px}
header{background:var(--n);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:5;border-bottom:4px solid var(--g)}
header img{width:36px;height:36px;border-radius:50%;background:#fff}header b{flex:1}header select{width:auto;min-height:40px}
.tag{background:var(--g);color:var(--n);padding:4px 10px;border-radius:20px;font-weight:700}
#badge{font-size:13px;color:#cfe0f5}
nav{display:flex;gap:8px;padding:10px 12px;overflow-x:auto}nav button{flex:none;min-height:42px;padding:6px 16px}
main{padding:0 12px 12px}.bar,.row{display:flex;gap:8px;margin-bottom:10px}.bar button{flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.card{background:#fff;color:var(--t);border:2px solid #dfe5ec;display:flex;flex-direction:column;gap:2px;text-align:left;min-height:84px}
.card span{color:var(--n);font-weight:800}.card small{color:var(--m);font-weight:500}.bad{color:var(--bad)!important}
#cart{position:sticky;bottom:0;background:#fff;border-top:4px solid var(--g);padding:10px 12px;margin:0 -12px -12px}
.lines{max-height:28vh;overflow:auto;margin-bottom:8px}.ln{display:flex;align-items:center;gap:8px;margin-bottom:6px}.ln span{flex:1}.ln button{min-width:44px;padding:0}
.tot{font-size:20px;font-weight:800;color:var(--n);white-space:nowrap;text-align:right}.tot small{display:block;font-size:12px;color:var(--m);font-weight:500}
.hint{color:var(--m);text-align:center}.li{background:#fff;padding:12px;border-radius:12px;margin-bottom:8px;display:flex;flex-direction:column}.li span{color:var(--m);font-size:14px}
.card2{background:#fff;padding:12px;border-radius:12px;display:grid;gap:8px;margin-bottom:12px}label{display:grid;gap:4px;font-size:14px;color:var(--m)}
.login{max-width:380px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px;text-align:center}.login img{width:70%;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}.dots{height:36px;font-size:28px;letter-spacing:6px;color:var(--n)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pad button{min-height:56px;font-size:20px}
.modal,#scan{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;display:grid;gap:10px}
.sheet .row{margin:0}.big{font-size:22px;font-weight:800;color:var(--n);text-align:center}
#scan{flex-direction:column;align-items:stretch;background:#000;justify-content:center;gap:10px;padding:12px}#scan video{width:100%;max-height:70vh;border-radius:12px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--n);color:#fff;padding:10px 16px;border-radius:24px;z-index:30;max-width:90%;text-align:center}
[hidden]{display:none!important}
</style></head><body>
<div id="app"></div><div id="modal"></div>
<div id="scan" hidden><video id="cam" playsinline muted></video><button class="g" onclick="stopScan()">Close camera</button></div>
<div id="toast" hidden></div>
<script>
const API='https://script.google.com/macros/s/AKfycbyF_UYkqJplXiQeo6qO-r6DDmYA2THuqXnu5n2Lx44qG6GG1DP-RaGbTE5JV9gzmXJzCg/exec';
const $=s=>document.querySelector(s),LS=localStorage;
const J=(k,d)=>{try{return JSON.parse(LS.getItem(k))??d}catch(e){return d}};
const put=(k,v)=>LS.setItem(k,JSON.stringify(v));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=J('sess',{}),names=J('names',[]),cart=[],disc=0,view='sell',q='',pay=null,pin='',pick='',syncing=false,stopFn=null,loadErr='';
const api=b=>fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b)}).then(r=>r.json());
const step=()=>+S.settings?.rounding||500,rate=()=>+S.settings?.rate||11850;
const fmt=n=>Math.round(n).toLocaleString('en-US')+' SH',rt=x=>Math.round(x/step())*step();
const queue=()=>J('q',[]),P=id=>S.products.find(p=>p.ID==id);
const biz=()=>S.user.business=='both'?(S.biz||'shop'):S.user.business;
const sub=()=>cart.reduce((a,c)=>a+P(c.id).Price*c.qty,0),total=()=>rt(Math.max(0,sub()-disc));
const LBL={rate:'USD rate (SH for $1)',rounding:'Round totals to (SH)',shop_zaad:'Shop Zaad number',shop_edahab:'Shop Edahab number',fast_zaad:'Fast Food Zaad number',fast_edahab:'Fast Food Edahab number',fast_close:'Fast Food closing time'};
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}

/* ---------- login ---------- */
function loginView(){$('#app').innerHTML=`<div class=login><img src=logo.png alt="Saado"><h3>Who is working?</h3>
<div class=chips>${names.map(n=>`<button class="${n==pick?'g':'o'}" onclick="pick='${esc(n)}';loginView()">${esc(n)}</button>`).join('')||'<p class=hint>Could not load names.</p><p class=hint style="color:#b3261e">'+esc(loadErr)+'</p>'}</div>
<div class=dots>${'●'.repeat(pin.length)}</div><div class=pad>${[1,2,3,4,5,6,7,8,9,'⌫',0,'OK'].map(k=>`<button class=o onclick="key('${k}')">${k}</button>`).join('')}</div></div>`}
async function key(k){
 if(k=='⌫')pin=pin.slice(0,-1);
 else if(k=='OK'){
  if(!pick||pin.length<4)return toast('Choose your name and enter your PIN');
  try{const r=await api({action:'login',name:pick,pin});if(!r.ok)throw 0;
   S={token:r.token,user:r.user,settings:{},products:[]};pin='';put('sess',S);await refresh();render();sync();return}
  catch(e){toast('Wrong PIN, or no internet');pin=''}
 }else if(pin.length<6)pin+=k;
 loginView()}
async function refresh(){try{const r=await api({action:'data',token:S.token});if(r.ok){S.settings=r.settings;S.products=r.products;put('sess',S)}}catch(e){}}
async function loadNames(){try{const r=await api({action:'users'});if(r.ok){names=r.users;put('names',names);loadErr=''}else loadErr='The script answered with an error: '+r.error;}catch(e){loadErr='Cannot reach the script ('+e.message+'). The app is using this address: '+API.slice(0,60)}if(!S.token)loginView()}

/* ---------- shell ---------- */
function render(){
 if(!S.token)return loginView();const b=biz(),o=S.user.role=='owner';
 const tabs=[['sell','Sell'],...(o?[['prod','Products'],['set','Settings']]:[]),['out','Sign out']];
 $('#app').innerHTML=`<header><img src=icon-192.png alt=""><b>Saado POS</b>${S.user.business=='both'?
 `<select onchange="S.biz=this.value;cart=[];disc=0;render()"><option value=shop ${b=='shop'?'selected':''}>Shop</option><option value=fast ${b=='fast'?'selected':''}>Fast Food</option></select>`:
 `<span class=tag>${b=='shop'?'Shop':'Fast Food'}</span>`}<span id=badge></span></header>
 <nav>${tabs.map(([v,l])=>`<button class="${view==v?'g':'o'}" onclick="go('${v}')">${l}</button>`).join('')}</nav><main>${V[view]()}</main>`;badge()}
function go(v){if(v=='out'){S={};put('sess',S);cart=[];disc=0;view='sell';return loginView()}view=v;render()}
function badge(){const e=$('#badge'),n=queue().length,f=J('failed',[]).length;if(e)e.textContent=(navigator.onLine?'':'Offline · ')+(n?n+' waiting to sync':'All synced')+(f?' · '+f+' failed':'')}

/* ---------- sell ---------- */
const V={
sell(){return `<div class=bar><input id=q placeholder="Search name or barcode" value="${esc(q)}" oninput="q=this.value;grid()"><button class=g onclick="scan(addBar)">Scan</button></div><div id=grid class=grid></div><div id=cart></div>`},
prod(){const b=biz();return `<div class=bar><button class=g onclick="edit()">+ New product</button></div><div id=form></div>${S.products.filter(p=>p.Business==b).map(p=>`<div class=li onclick="edit('${p.ID}')"><b>${esc(p.Name)}</b><span>${fmt(p.Price)} · cost ${fmt(p.Cost)}${b=='shop'?' · stock '+p.Stock:''}</span></div>`).join('')}`},
set(){return `<div class=card2>${Object.keys(S.settings).map(k=>`<label>${LBL[k]||k}<input id=s_${k} value="${esc(S.settings[k])}"></label>`).join('')}<button class=g onclick="saveSet()">Save settings</button></div>`}};
const after={sell(){grid();cartUpdate()}};
const origRender=render;render=function(){origRender();(after[view]||(()=>{}))()};
function grid(){const b=biz(),k=q.toLowerCase();$('#grid').innerHTML=S.products.filter(p=>p.Business==b&&(!k||(p.Name+p.Barcode).toLowerCase().includes(k))).map(p=>
 `<button class=card onclick="add('${p.ID}')"><b>${esc(p.Name)}</b><span>${fmt(p.Price)}</span>${b=='shop'?`<small class="${p.Stock<=p.LowStock?'bad':''}">Stock ${p.Stock}${p.Stock<=p.LowStock?' · low':''}</small>`:''}</button>`).join('')||'<p class=hint>No products found</p>'}
function add(id){const c=cart.find(x=>x.id==id);c?c.qty++:cart.push({id,qty:1});cartUpdate()}
function addBar(code){const p=S.products.find(p=>p.Business==biz()&&String(p.Barcode)==String(code));p?(add(p.ID),toast('Added: '+p.Name)):toast('Barcode not found: '+code)}
function qty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);cartUpdate()}
const totH=()=>`${fmt(total())}<small>$${(total()/rate()).toFixed(2)}</small>`;
function tot(){$('#tot').innerHTML=totH()}
function cartUpdate(){const c=$('#cart');if(!c)return;c.innerHTML=!cart.length?'<p class=hint>Tap a product or scan a barcode</p>':
 `<div class=lines>${cart.map((c,i)=>`<div class=ln><span>${esc(P(c.id).Name)}</span><button class=o onclick="qty(${i},-1)">−</button><b>${c.qty}</b><button class=o onclick="qty(${i},1)">+</button></div>`).join('')}</div>
 <div class=row><input type=number inputmode=numeric placeholder="Discount (SH)" value="${disc||''}" oninput="disc=+this.value||0;tot()"><div class=tot id=tot>${totH()}</div></div><button class=g style="width:100%" onclick="startPay()">Pay</button>`}

/* ---------- payment ---------- */
function startPay(){pay={m:'Cash',cur:'SH',amt:''};showPay()}
function showPay(){const m=$('#modal');if(!pay){m.innerHTML='';return}const t=total();
 m.innerHTML=`<div class=modal><div class=sheet><div class=big>${fmt(t)} <small>($${(t/rate()).toFixed(2)})</small></div>
 <div class=row>${['Cash','Zaad','Edahab'].map(x=>`<button class="${pay.m==x?'g':'o'}" style="flex:1" onclick="pay.m='${x}';showPay()">${x}</button>`).join('')}</div>
 ${pay.m=='Cash'?`<div class=row><input id=amt type=number inputmode=decimal placeholder="Customer gives" value="${pay.amt}" oninput="pay.amt=this.value;chg()"><button class=o style="width:90px" onclick="pay.cur=pay.cur=='USD'?'SH':'USD';showPay()">${pay.cur}</button></div><div id=chg class=big></div>`:
 `<div class=big>Send to ${esc(S.settings[(biz()=='shop'?'shop_':'fast_')+pay.m.toLowerCase()]||'-')}</div>`}
 <div class=row><button class=o style="flex:1" onclick="pay=null;showPay()">Back</button><button class=g style="flex:2" onclick="done()">Confirm sale</button></div></div></div>`;chg()}
const paid=()=>(+pay.amt||0)*(pay.cur=='USD'?rate():1);
function chg(){const e=$('#chg');if(!e)return;if(!pay.amt){e.textContent='';return}const d=paid()-total();e.textContent=d>=0?'Change: '+fmt(d):'Short by '+fmt(-d);e.className='big'+(d<0?' bad':'')}
function done(){const t=total();if(pay.m=='Cash'&&pay.amt&&paid()<t)return toast('Amount is less than the total');
 const s={id:'S'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),time:Date.now(),business:biz(),items:cart.map(c=>({id:c.id,qty:c.qty})),discount:disc,payment:pay.m,
  tendered:pay.m=='Cash'&&pay.amt?pay.amt+' '+pay.cur:'',change:pay.m=='Cash'&&pay.amt?Math.round(paid()-t):''};
 put('q',[...queue(),s]);if(biz()=='shop')cart.forEach(c=>P(c.id).Stock-=c.qty);put('sess',S);
 cart=[];disc=0;pay=null;showPay();grid();cartUpdate();badge();toast('Sale saved');sync()}

/* ---------- offline sync ---------- */
async function sync(){if(syncing||!queue().length||!navigator.onLine||!S.token)return;syncing=true;
 try{while(queue().length){const s=queue()[0],r=await api({action:'sale',token:S.token,sale:s});
  if(r.error=='AUTH'){toast('Sign in again to sync your sales');S.token=null;loginView();break}
  if(!r.ok)put('failed',[...J('failed',[]),{...s,error:r.error}]);
  put('q',queue().slice(1));badge()}}catch(e){}
 syncing=false;badge()}

/* ---------- barcode camera ---------- */
async function scan(cb){
 if(!('BarcodeDetector' in window)){const c=prompt('Type the barcode');if(c)cb(c.trim());return}
 try{const m=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}),v=$('#cam');v.srcObject=m;$('#scan').hidden=false;await v.play();
  const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39']});let on=true;
  stopFn=()=>{on=false;m.getTracks().forEach(t=>t.stop());$('#scan').hidden=true};
  while(on){try{const r=await det.detect(v);if(r.length){const code=r[0].rawValue;stopFn();cb(code);return}}catch(e){}await new Promise(r=>setTimeout(r,250))}
 }catch(e){toast('Camera not available. Allow camera access.')}}
const stopScan=()=>stopFn&&stopFn();

/* ---------- owner: products & settings ---------- */
function edit(id){const p=id?P(id):{},shop=biz()=='shop';
 $('#form').innerHTML=`<div class=card2>${[['Name','text'],['Barcode','text'],['Price','number'],['Cost','number'],...(shop?[['Stock','number'],['LowStock','number'],['Expiry','date']]:[])].map(([k,t])=>`<label>${k=='LowStock'?'Low stock warning at':k}<input id=f_${k} type=${t} value="${esc(p[k]??'')}"></label>`).join('')}
 <div class=row><button class=o style="flex:1" onclick="scan(c=>f_Barcode.value=c)">Scan barcode</button><button class=g style="flex:1" onclick="save('${id||''}')">Save product</button></div></div>`;scrollTo(0,0)}
async function save(id){const p=id?{...P(id)}:{Business:biz()};['Name','Barcode','Price','Cost','Stock','LowStock','Expiry'].forEach(k=>{const e=$('#f_'+k);if(e)p[k]=e.value});
 if(!p.Name||!p.Price)return toast('Name and price are required');
 try{const r=await api({action:'saveProduct',token:S.token,product:p});if(!r.ok)throw 0;await refresh();render();toast('Product saved')}catch(e){toast('Could not save. Check your internet.')}}
async function saveSet(){const v={};Object.keys(S.settings).forEach(k=>v[k]=$('#s_'+k).value);
 try{const r=await api({action:'saveSettings',token:S.token,values:v});if(!r.ok)throw 0;await refresh();render();toast('Settings saved')}catch(e){toast('Could not save. Check your internet.')}}

/* ---------- start ---------- */
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
addEventListener('online',()=>{sync();badge()});addEventListener('offline',badge);setInterval(sync,30000);
S.token?(render(),refresh().then(()=>{if(view=='sell')grid()}),sync()):loginView();loadNames();
</script></body></html>
